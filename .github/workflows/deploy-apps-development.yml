# 🎯 최적화된 CI/CD with SSM (캐시 병목 해결)
name: 'CI/CD: Build & Deploy to EC2 via SSM (ULTRA FAST - 1min Target)'

on:
  push:
    branches: [ develop, feature/ssm-config-migration ]
    #paths:
    #  - 'apps/**'
    #  - 'admin/**'
    #  - '.github/workflows/**'
    #  - 'docker-compose.yml'
    #  - 'package.json'
    #  - 'yarn.lock'

permissions:
  id-token: write
  contents: read

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names users-app 2>/dev/null || \
          aws ecr create-repository --repository-name users-app

      # 🚀 고성능 QEMU 설정
      - name: Set up QEMU (Ultra Fast)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # 🚀 고성능 Buildx 설정
      - name: Set up Docker Buildx (Performance Mode)
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          config-inline: |
            [worker.oci]
              max-parallelism = 4
            [worker.containerd] 
              max-parallelism = 4

      # 🎯 경량 캐시 전략 (병목 해결)
      - name: Build and Push users-app (Ultra Fast)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.ECR_REGISTRY }}/users-app:latest
          # 🚀 경량 캐시 전략 (속도 우선)
          cache-from: |
            type=gha,scope=users-app
          cache-to: |
            type=gha,mode=min,scope=users-app
          # 🎯 빌드 속도 최적화
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDPLATFORM=linux/amd64
            TARGETPLATFORM=linux/arm64
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            NEXT_PUBLIC_GOOGLE_RESPONSE_TYPE=${{ secrets.GOOGLE_RESPONSE_TYPE }}
            NEXT_PUBLIC_GOOGLE_SCOPE=${{ secrets.GOOGLE_SCOPE }}
            NEXT_PUBLIC_GOOGLE_AUTH_URL=${{ secrets.GOOGLE_AUTH_URL }}
          # 추가 최적화
          provenance: false
          sbom: false
          outputs: type=registry

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names admin-app 2>/dev/null || \
          aws ecr create-repository --repository-name admin-app

      # 🚀 고성능 QEMU 설정
      - name: Set up QEMU (Ultra Fast)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # 🚀 고성능 Buildx 설정
      - name: Set up Docker Buildx (Performance Mode)
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          config-inline: |
            [worker.oci]
              max-parallelism = 4
            [worker.containerd]
              max-parallelism = 4

      # 🎯 경량 캐시 전략 (Admin 전용)
      - name: Build and Push admin-app (Ultra Fast)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: admin/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.ECR_REGISTRY }}/admin-app:latest
          # 🚀 경량 캐시 전략 (병목 해결)
          cache-from: |
            type=gha,scope=admin-app
          cache-to: |
            type=gha,mode=min,scope=admin-app
          # 🎯 빌드 속도 최적화
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDPLATFORM=linux/amd64
            TARGETPLATFORM=linux/arm64
          # 추가 최적화
          provenance: false
          sbom: false
          outputs: type=registry

  deploy:
    name: 🚀 Deploy to EC2 via SSM (Ultra Fast)
    runs-on: ubuntu-latest
    needs: [build-apps, build-admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read docker-compose.yml content
        id: compose-content
        run: |
          COMPOSE_CONTENT=$(base64 -w 0 docker-compose.yml)
          echo "compose-content=$COMPOSE_CONTENT" >> $GITHUB_OUTPUT

      - name: Deploy via SSM (CPU Optimized)
        run: |
          # .env 파일 내용을 미리 준비
          cat > /tmp/env_content << 'EOF'
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NODE_ENV=production
          TARGET_ARCH=arm64
          EOF
          
          # .env 파일 내용을 base64로 인코딩
          ENV_CONTENT=$(base64 -w 0 /tmp/env_content)
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy FE Apps (Ultra Fast) - Run ID: ${{ github.run_id }}" \
            --parameters "commands=[
              \"echo '🚀 === Starting Ultra Fast FE Deployment ==='\",
              \"sudo rm -rf /home/ubuntu/apps/client\",
              \"mkdir -p /home/ubuntu/apps/client\",
              \"sudo chown -R ubuntu:ubuntu /home/ubuntu/apps/client\",
              \"cd /home/ubuntu/apps/client\",
              \"echo '=== Creating docker-compose.yml ==='\",
              \"echo '${{ steps.compose-content.outputs.compose-content }}' | base64 -d > docker-compose.yml\",
              \"echo '=== Creating .env file ==='\",
              \"echo '$ENV_CONTENT' | base64 -d > .env\",
              \"echo '🔍 === System Architecture Check ==='\",
              \"echo \\\"🏗️ 시스템 아키텍처: \$(uname -m)\\\"\",
              \"echo \\\"🐳 Docker 아키텍처: \$(docker version --format '{{.Server.Arch}}' 2>/dev/null || echo 'unknown')\\\"\",
              \"echo '🧹 === Conditional Docker Cleanup ==='\",
              \"DISK_USAGE=\$(df / | tail -1 | awk '{print \$5}' | sed 's/%//')\",
              \"DAY_OF_WEEK=\$(date +%u)\",
              \"if [ \$DAY_OF_WEEK -eq 1 ] || [ \$DISK_USAGE -gt 80 ]; then\",
              \"  echo \\\"🧹 Docker 리소스 정리 중...\\\"\",
              \"  docker system prune -af --volumes\",
              \"else\",
              \"  echo \\\"✅ 디스크 사용량 정상 (\$DISK_USAGE%), 정리 스킵\\\"\",
              \"fi\",
              \"echo '🔐 === ECR Login ==='\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }} 2>/dev/null\",
              \"echo '📦 === Pulling Images (CPU Optimized) ==='\",
              \"echo \\\"📱 users-app 이미지 다운로드...\\\"\",
              \"nice -n 10 docker pull ${{ env.ECR_REGISTRY }}/users-app:latest &\",
              \"USERS_PID=\$!\",
              \"echo \\\"⚙️ admin-app 이미지 다운로드...\\\"\",
              \"nice -n 10 docker pull ${{ env.ECR_REGISTRY }}/admin-app:latest &\",
              \"ADMIN_PID=\$!\",
              \"echo \\\"⏳ 이미지 다운로드 대기 중...\\\"\",
              \"wait \$USERS_PID && echo \\\"✅ users-app 다운로드 완료\\\"\",
              \"wait \$ADMIN_PID && echo \\\"✅ admin-app 다운로드 완료\\\"\",
              \"echo '🏗️ === Image Architecture Verification ==='\",
              \"USERS_ARCH=\$(docker inspect ${{ env.ECR_REGISTRY }}/users-app:latest --format='{{.Architecture}}' 2>/dev/null || echo 'unknown')\",
              \"ADMIN_ARCH=\$(docker inspect ${{ env.ECR_REGISTRY }}/admin-app:latest --format='{{.Architecture}}' 2>/dev/null || echo 'unknown')\",
              \"echo \\\"📱 users-app 아키텍처: \$USERS_ARCH\\\"\",
              \"echo \\\"⚙️ admin-app 아키텍처: \$ADMIN_ARCH\\\"\",
              \"echo '🔄 === Sequential Container Deployment ==='\",
              \"echo \\\"🛑 기존 컨테이너 정리...\\\"\",
              \"docker compose down users-app admin-app 2>/dev/null || true\",
              \"sleep 3\",
              \"echo \\\"🚀 users-app 시작 (포트 3000)...\\\"\",
              \"docker compose up -d users-app\",
              \"sleep 5\",
              \"echo \\\"🚀 admin-app 시작 (포트 3001)...\\\"\",
              \"docker compose up -d admin-app\",
              \"sleep 5\",
              \"echo '🏥 === Health Check (Advanced) ==='\",
              \"echo \\\"🔍 users-app 헬스체크...\\\"\",
              \"for i in {1..8}; do\",
              \"  if curl -f -s http://localhost:3000 > /dev/null; then\",
              \"    echo \\\"✅ users-app 정상 구동 (\${i}회차)\\\"\",
              \"    break\",
              \"  else\",
              \"    echo \\\"⏳ users-app 헬스체크 재시도... (\$i/8)\\\"\",
              \"    sleep 3\",
              \"  fi\",
              \"done\",
              \"echo \\\"🔍 admin-app 헬스체크...\\\"\",
              \"for i in {1..8}; do\",
              \"  if curl -f -s http://localhost:3001 > /dev/null; then\",
              \"    echo \\\"✅ admin-app 정상 구동 (\${i}회차)\\\"\",
              \"    break\",
              \"  else\",
              \"    echo \\\"⏳ admin-app 헬스체크 재시도... (\$i/8)\\\"\",
              \"    sleep 3\",
              \"  fi\",
              \"done\",
              \"echo '📊 === Final Status Report ==='\",
              \"echo \\\"🐳 컨테이너 상태:\\\"\",
              \"docker ps -a | grep -E 'users-app|admin-app' || true\",
              \"echo \\\"📋 서비스 로그 (users-app):\\\"\",
              \"docker compose logs users-app --tail=20 || true\",
              \"echo \\\"📋 서비스 로그 (admin-app):\\\"\",
              \"docker compose logs admin-app --tail=20 || true\",
              \"echo '🧹 === Background Cleanup ==='\",
              \"echo \\\"🗑️ 사용하지 않는 이미지 정리 중...\\\"\",
              \"docker image prune -f > /dev/null 2>&1 &\",
              \"echo '🎉 === Ultra Fast FE Deployment Complete! ==='\",
              \"echo \\\"✅ users-app: http://localhost:3000\\\"\",
              \"echo \\\"✅ admin-app: http://localhost:3001\\\"\",
              \"echo \\\"🚀 Total deployment time: \$(date)\\\"\",
              \"echo '=== FE Deployment Success ==='\"\
            ]" \
            --query 'Command.CommandId' \
            --output text)
          
          echo "SSM Command ID: $COMMAND_ID"
          echo "command-id=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for deployment completion
        run: |
          echo "Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --cli-read-timeout 900
          
          echo "SSM command completed!"

      - name: Get deployment results
        run: |
          echo "=== Fetching deployment results ==="
          
          COMMAND_STATUS=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Status' \
            --output text)
          
          echo "Command Status: $COMMAND_STATUS"
          
          STDOUT=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' \
            --output text)
          
          echo "=== Deployment Output ==="
          echo "$STDOUT"
          
          STDERR=$(aws ssm get-command-invocation \
            --command-id ${{ env.command-id }} \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardErrorContent' \
            --output text)
          
          # Docker 경고 메시지는 무시하고 실제 에러만 체크
          if [ "$STDERR" != "None" ] && [ "$STDERR" != "" ]; then
            echo "=== Deployment Warnings/Errors ==="
            echo "$STDERR"
          
            # Docker 로그인 경고는 무시
            if echo "$STDERR" | grep -q "WARNING.*password.*unencrypted"; then
              echo "Ignoring Docker login warning - deployment successful"
            elif echo "$STDERR" | grep -qi "error\|failed\|fatal"; then
              echo "Real error detected, failing deployment"
              exit 1
            else
              echo "Non-critical warnings detected, continuing"
            fi
          fi
          
          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Deployment failed with status: $COMMAND_STATUS"
            exit 1
          fi
          
          echo "=== Ultra Fast FE Deployment Success ==="